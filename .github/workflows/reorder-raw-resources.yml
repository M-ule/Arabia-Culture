name: Reorder intermediate resources
on:
  push:
    paths: ['.github/workflows/reorder-raw-resources.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old=\"const rawOrder=['커피콩','몰약','석유','면화','황동'];\"; new=\"const rawOrder=['커피콩','황동','몰약','석유','면화'];\"; assert old in s; p.write_text(s.replace(old,new), encoding='utf-8')"
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Reorder intermediate resources'
          git push
