name: Update tooltip
on:
  push:
    paths: ['.github/workflows/update-tooltip.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sed -i 's/중간 자원 구매에 필요한 금화·낙타가 부족하면 해당 자원을 표시합니다. 현재 보유량과 예상 생산량을 합친 값으로 판단합니다./기초 자원인 금화·낙타의 부족 여부를 표시합니다./g' index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Shorten shortage tooltip'
          git push
