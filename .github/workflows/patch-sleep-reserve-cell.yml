name: Patch sleep reserve cell styling

on:
  push:
    paths:
      - '.github/workflows/patch-sleep-reserve-cell.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove conditional color from sleep reserve remainder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<td class="num calc '+remainClass(a.remain)+'">'+fmtQty(a.remain)+'</td>'''
          new = '''<td class="num calc">'+fmtQty(a.remain)+'</td>'''
          if old not in s:
              raise SystemExit('target sleep reserve remainder cell not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove conditional color from sleep reserve remainder"
          git push origin HEAD:main
