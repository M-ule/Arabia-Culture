name: ChatGPT update Arabia note
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-update-note.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update guide text
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='2. <b>기초 자원</b>은 현재 보유량과 예상 생산량을 기준으로 필요한 금화·낙타의 충족 여부와 소요 시간을 계산합니다.<br>'
          new='2. <b>기초 자원</b>은 현재 보유량과 예상 생산량을 기준으로 필요한 금화·낙타의 충족 여부와 소요 시간을 계산합니다. <b>소요 시간(h)</b>은 현재 보유량을 포함하여 부족한 기초 자원이 처음 ‘잔여’가 되기까지 필요한 운영 시간입니다.<br>'
          assert s.count(old)==1, f'expected 1 match, found {s.count(old)}'
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "4cf75266f5ae16e20b7de6123692a0b5286d4b15"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify basic resource required time"
          git push
