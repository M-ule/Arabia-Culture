name: Apply city composition update

on:
  push:
    paths:
      - '.github/workflows/apply-city-composition-unify.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch simulator
        run: python .github/scripts/unify_city_buildings.py
      - name: Validate and commit
        shell: bash
        run: |
          grep -F '지금부터 취침 전까지 건물을 가동할 시간입니다. 비워 두면 기본 운영 시간을 사용합니다.' index.html
          grep -F "const h=c.dirhamHours===''?app.settings.baseH:c.dirhamHours" index.html
          grep -F "$('cityBuildings').innerHTML=makeTable(['건물','건물 수','가로×세로','면적 합계','일꾼'],cityRows);" index.html
          rm -f .github/workflows/apply-city-composition-unify.yml
          rm -f .github/scripts/unify_city_buildings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Unify city building composition table"
          git push
