name: Simplify sleep reserve note

on:
  push:
    paths:
      - '.github/workflows/patch-sleep-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch note
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''    2. <b>수면 대비 자원 확보</b>는 <b>수면까지 남은 시간(h)</b> 동안의 최종 상품 생산에 사용되는 중간 자원, 중간 자원의 현재 보유량, 금화·낙타의 현재 보유량을 함께 반영하여 수면 중 필요한 중간 자원을 구매하기 위한 생산력을 계산합니다. <b>수면까지 남은 시간(h)</b>이 비어 있으면 <b>일괄 운영 시간</b>을 적용하고, 값을 입력하면 해당 시간을 우선 적용합니다. <b>수면 중 필요량</b>은 선택한 <b>수면 중 생산 주기 × 반복 횟수</b>를 기준으로 하며, 현재 레벨에서 선택한 주기를 사용할 수 없으면 이용 가능한 가장 긴 생산 주기를 적용합니다.<br>'''
          new='''    2. <b>수면 대비 자원 확보</b>는 <b>수면까지 남은 시간(h)</b> 동안의 최종 상품 생산에 사용되는 중간 자원, 중간 자원의 현재 보유량, 금화·낙타의 현재 보유량을 함께 반영하여 수면 중 필요한 중간 자원을 구매하기 위한 생산력을 계산합니다.<br>'''
          if old not in s:
              raise SystemExit('target note not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-sleep-note.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Simplify sleep reserve note"
          git push
