name: Update shortage title
on:
  push:
    paths: ['.github/workflows/update-shortage-title.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sed -i "s/금화·낙타 부족/조정 필요 생산 항목/g" index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Rename shortage summary title'
          git push
