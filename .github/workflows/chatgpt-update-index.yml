name: ChatGPT update Arabia index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-update-index.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write verified index
        shell: python
        run: |
          import base64, lzma, pathlib
          payload = ''''''
          data = lzma.decompress(base64.b64decode(payload))
          pathlib.Path('index.html').write_bytes(data)
      - name: Verify and commit
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "8fd9450aa773b9e32fc3fa09d4f1a5ccdf569843"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Arabia calculator"
          git push
