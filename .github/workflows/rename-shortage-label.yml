name: Rename shortage summary

on:
  push:
    paths:
      - '.github/workflows/rename-shortage-label.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update shortage label and tooltip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_title = '조정 필요 생산 항목'
          new_title = '금화·낙타 부족'
          old_tip = '현재 생산 계획에 필요한 금화·낙타가 부족한 항목입니다.'
          new_tip = '중간 자원 구매에 필요한 금화·낙타가 부족하면 해당 자원을 표시합니다. 현재 보유량과 예상 생산량을 합친 값으로 판단합니다.'
          assert old_title in s
          assert old_tip in s
          s = s.replace(old_title, new_title)
          s = s.replace(old_tip, new_tip)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify gold and camel shortage summary"
          git push
