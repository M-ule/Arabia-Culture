name: Patch average happiness headers

on:
  push:
    paths:
      - '.github/workflows/patch-average-happiness-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename general happiness table headers only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<th>행복도(%)</th>'
          new='<th>평균 행복도(%)</th>'
          count=s.count(old)
          if count == 0:
              raise SystemExit('general happiness table header not found')
          print(f'replacing {count} general table header(s)')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify detail labels remain unchanged
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          if '<th>평균 행복도(%)</th>' not in s:
              raise SystemExit('average happiness header missing')
          if '행복도(%)' not in s:
              raise SystemExit('detail happiness wording appears to have been removed globally')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rename general happiness columns to average happiness"
          git push origin HEAD:main
