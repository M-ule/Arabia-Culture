name: Rename sleep production count label

on:
  push:
    paths:
      - '.github/workflows/patch-sleep-count-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<label for="sleepCount">반복 횟수</label>'
          new = '<label for="sleepCount">생산 횟수</label>'
          if s.count(old) != 1:
              raise SystemExit(f'expected one sleepCount label, got {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-sleep-count-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rename sleep repeat count to production count"
          git push
