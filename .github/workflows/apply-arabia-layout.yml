name: Apply Arabia layout update

on:
  push:
    paths:
      - '.github/workflows/apply-arabia-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch simulator
        shell: bash
        run: python .github/scripts/apply_arabia_layout.py
      - name: Validate, commit, and clean up
        shell: bash
        run: |
          grep -F '지금부터 취침 전까지 건물을 가동할 시간입니다. 자원 건물도 포함되며' index.html
          grep -F '<th>시간당 생산량</th><th>운영 시간(h)</th>' index.html
          grep -F "const cityBuildingOrder=['Merchant_Average','CamelFarm_Average','Merchant_Premium'" index.html
          rm -f .github/workflows/apply-arabia-layout.yml
          rm -f .github/scripts/apply_arabia_layout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update sleep guidance, dirham order, and city building order"
          git push
